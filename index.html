<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Standford</title>
<style>
  /* ==========================================================================
     1. Material 3 ベースライン カラーロール（draft_j_material3.html と完全統一）
     ========================================================================== */
  :root{
    --primary:#6750a4; --on-primary:#ffffff;
    --primary-container:#eaddff; --on-primary-container:#21005d;
    --secondary-container:#e8def8; --on-secondary-container:#1d192b;
    --tertiary:#7d5260; --on-tertiary:#ffffff;
    --tertiary-container:#ffd8e4; --on-tertiary-container:#31111d;
    --surface:#fef7ff; --on-surface:#1d1b20; --on-surface-variant:#49454f;
    --sc-low:#f7f2fa; --sc:#f3edf7; --sc-high:#ece6f0; --sc-highest:#e6e0e9;
    --outline:#79747e; --outline-variant:#cac4d0;
    --highlight:#ffe08a; --on-highlight:#1d1b20;
    --inverse-surface:#322f35; --inverse-on-surface:#f5eff7;
    /* 区分タグ: プライマリのトーナルパレット 6 段階(淡 → 濃) */
    --t1:#f6edff; --on-t1:#21005d;
    --t2:#eaddff; --on-t2:#21005d;
    --t3:#d0bcff; --on-t3:#21005d;
    --t4:#b69df8; --on-t4:#21005d;
    --t5:#6750a4; --on-t5:#ffffff;
    --t6:#4f378b; --on-t6:#ffffff;
    --font:"Google Sans","Roboto","Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }

  html[data-theme="dark"]{
    --primary:#d0bcff; --on-primary:#381e72;
    --primary-container:#4f378b; --on-primary-container:#eaddff;
    --secondary-container:#4a4458; --on-secondary-container:#e8def8;
    --tertiary:#efb8c8; --on-tertiary:#492532;
    --tertiary-container:#633b48; --on-tertiary-container:#ffd8e4;
    --surface:#141218; --on-surface:#e6e0e9; --on-surface-variant:#cac4d0;
    --sc-low:#1d1b20; --sc:#211f26; --sc-high:#2b2930; --sc-highest:#36343b;
    --outline:#938f99; --outline-variant:#49454f;
    --highlight:#6b5a12; --on-highlight:#fff3c4;
    --inverse-surface:#e6e0e9; --inverse-on-surface:#322f35;
    --t1:#2d2640; --on-t1:#eaddff;
    --t2:#3a2f5c; --on-t2:#eaddff;
    --t3:#4f378b; --on-t3:#eaddff;
    --t4:#6750a4; --on-t4:#ffffff;
    --t5:#b69df8; --on-t5:#21005d;
    --t6:#d0bcff; --on-t6:#381e72;
  }

  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --primary:#d0bcff; --on-primary:#381e72;
      --primary-container:#4f378b; --on-primary-container:#eaddff;
      --secondary-container:#4a4458; --on-secondary-container:#e8def8;
      --tertiary:#efb8c8; --on-tertiary:#492532;
      --tertiary-container:#633b48; --on-tertiary-container:#ffd8e4;
      --surface:#141218; --on-surface:#e6e0e9; --on-surface-variant:#cac4d0;
      --sc-low:#1d1b20; --sc:#211f26; --sc-high:#2b2930; --sc-highest:#36343b;
      --outline:#938f99; --outline-variant:#49454f;
      --highlight:#6b5a12; --on-highlight:#fff3c4;
      --inverse-surface:#e6e0e9; --inverse-on-surface:#322f35;
      --t1:#2d2640; --on-t1:#eaddff;
      --t2:#3a2f5c; --on-t2:#eaddff;
      --t3:#4f378b; --on-t3:#eaddff;
      --t4:#6750a4; --on-t4:#ffffff;
      --t5:#b69df8; --on-t5:#21005d;
      --t6:#d0bcff; --on-t6:#381e72;
    }
  }

  /* ==========================================================================
     2. ベーススタイル
     ========================================================================== */
  *{box-sizing:border-box;}
  html{background:var(--surface);}
  body{
    margin:0;background:var(--surface);color:var(--on-surface);
    font-family:var(--font);font-size:14px;line-height:1.5;letter-spacing:.2px;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px;}
  .layout{display:flex;min-height:100vh;}

  /* ==========================================================================
     3. ナビゲーションドロワー（PC左固定 / モバイル上部チップ）
     ========================================================================== */
  .drawer{
    width:300px;flex-shrink:0;padding:1.5rem .75rem 1.5rem;
    background:var(--sc-low);
    position:sticky;top:0;height:100vh;overflow-y:auto;
    border-radius:0 16px 16px 0;
  }

  .drawer .brand-sub{font-size:14px;color:var(--on-surface-variant);margin:0 1rem 1.2rem;}
  .drawer-heading{
    font-size:14px;font-weight:500;color:var(--on-surface-variant);
    margin:1rem 1rem .3rem;letter-spacing:.1px;
  }
  .drawer-list{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    all:unset;box-sizing:border-box;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    min-height:48px;padding:0 1rem;border-radius:28px;
    font-size:14px;font-weight:500;color:var(--on-surface-variant);letter-spacing:.1px;
    position:relative;
  }
  .nav-item::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;pointer-events:none;}
  .nav-item:hover::after{opacity:.08;}
  .nav-item:focus-visible{outline:3px solid var(--primary);outline-offset:-2px;}
  .nav-item[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);}
  .nav-item .lead{display:flex;align-items:center;gap:.7rem;min-width:0;}
  .nav-item .n{font-size:14px;color:inherit;opacity:.75;font-variant-numeric:tabular-nums;}
  .swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid var(--outline-variant);}

  .theme-btn{
    all:unset;box-sizing:border-box;cursor:pointer;margin:1.4rem 1rem 0;
    display:inline-flex;align-items:center;gap:.5rem;height:40px;padding:0 1rem;border-radius:20px;
    color:var(--primary);font-size:14px;font-weight:500;position:relative;
  }
  .theme-btn:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);}
  .theme-btn:focus-visible{outline:3px solid var(--primary);outline-offset:1px;}

  /* ==========================================================================
     4. メインコンテンツ & 検索バー
     ========================================================================== */
  .content{flex:1;min-width:0;max-width:860px;padding:1.5rem 2rem 4.5rem;}

  .searchbar{
    position:relative;display:flex;align-items:center;
    height:56px;border-radius:28px;background:var(--sc-high);padding:0 .5rem 0 1rem;gap:.5rem;
    margin-bottom:1.1rem;
  }
  .searchbar:focus-within{outline:3px solid var(--primary);outline-offset:0;}
  .searchbar svg{color:var(--on-surface-variant);flex-shrink:0;}
  .searchbar input{
    flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--on-surface);
    font-family:inherit;font-size:16px;letter-spacing:.5px;
  }
  .searchbar input:focus{outline:none;}
  .searchbar input::placeholder{color:var(--on-surface-variant);}
  .clear{
    all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:50%;
    display:none;align-items:center;justify-content:center;color:var(--on-surface-variant);
  }
  .clear.show{display:flex;}
  .clear:hover{background:color-mix(in srgb,var(--on-surface-variant) 10%,transparent);}
  .clear:focus-visible{outline:3px solid var(--primary);outline-offset:0;}

  .status{font-size:14px;color:var(--on-surface-variant);margin:0 0 1rem .5rem;}

  /* ==========================================================================
     5. セクション & ポータルカード（ツールグリッド / 資料リスト）
     ========================================================================== */
  .section{margin-bottom:1.75rem;}
  .section-head{
    display:flex;align-items:center;justify-content:space-between;gap:.75rem;
    margin:0 .25rem .75rem;
  }
  .section-title{
    margin:0;font-size:14px;font-weight:500;color:var(--on-surface-variant);
    letter-spacing:.1px;
  }
  .section-count{
    font-size:12px;font-weight:500;color:var(--on-surface-variant);
    font-variant-numeric:tabular-nums;
  }

  /* グループ1: 業務・計算ツール（2列〜3列レスポンシブグリッド） */
  .tools-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:.75rem;
  }
  @media (min-width:600px){
    .tools-grid{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }
  }

  .tool-card{
    position:relative;
    display:flex;flex-direction:column;justify-content:flex-start;
    min-height:132px;padding:1rem 1.15rem;
    border-radius:16px;
    background:var(--sc-low);
    color:var(--on-surface);
    border:1px solid transparent;
    overflow:hidden;
  }
  .tool-card:hover{background:var(--sc);}
  .tool-card:active{background:var(--sc-high);}

  /* 最上部 緊急時強調カード: 店舗ハザードマップ */
  .emergency-card{
    position:relative;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    width:100%;min-height:104px;
    padding:1.15rem 1.25rem;
    border-radius:16px;
    background:var(--tertiary-container);
    color:var(--on-tertiary-container);
    border:1px solid transparent;
    overflow:hidden;
  }
  .emergency-card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:currentColor;opacity:0;pointer-events:none;
  }
  .emergency-card:hover::after{opacity:.08;}
  .emergency-card:active::after{opacity:.12;}

  .featured-main{display:flex;align-items:center;gap:1rem;min-width:0;}
  .featured-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin-bottom:.25rem;}

  .card-top{
    display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;
    margin-bottom:.85rem;
  }

  /* アイコンコンテナ */
  .icon-box{
    width:40px;height:40px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--secondary-container);color:var(--on-secondary-container);
  }
  .emergency-card .icon-box{
    width:48px;height:48px;border-radius:14px;
    background:var(--tertiary);color:var(--on-tertiary);
  }
  .icon-box svg{width:22px;height:22px;}

  .card-title{
    margin:0;font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;
    color:inherit;
  }
  .emergency-card .card-title{
    font-size:17px;line-height:24px;font-weight:600;
  }
  .card-desc{
    margin:.25rem 0 0;font-size:13px;line-height:20px;letter-spacing:.25px;
    color:var(--on-surface-variant);
  }
  .emergency-card .card-desc{
    color:var(--on-tertiary-container);opacity:.88;
  }

  .card-arrow{
    width:20px;height:20px;flex-shrink:0;
    color:var(--on-surface-variant);opacity:.75;
  }
  .emergency-card .card-arrow{color:var(--on-tertiary-container);opacity:.9;}

  /* グループ2: 制度・資料（フル幅リストカード） */
  .docs-list{display:flex;flex-direction:column;gap:.75rem;}

  .doc-card{
    display:flex;align-items:center;gap:1rem;
    padding:1rem 1.25rem;
    border-radius:16px;
    background:var(--sc-low);
    color:var(--on-surface);
    border:1px solid transparent;
  }
  .doc-card:hover{background:var(--sc);}
  .doc-card:active{background:var(--sc-high);}

  /* 最下部 店舗別セクション（控えめなリストカード） */
  .store-card{
    display:flex;align-items:center;gap:.9rem;
    padding:.85rem 1.15rem;
    border-radius:14px;
    background:transparent;
    color:var(--on-surface);
    border:1px solid var(--outline-variant);
  }
  .store-card:hover{background:var(--sc-low);}
  .store-card:active{background:var(--sc);}
  .store-card .icon-box{
    width:36px;height:36px;border-radius:10px;
    background:var(--sc-high);color:var(--on-surface-variant);
  }
  .store-card .icon-box svg{width:19px;height:19px;}
  .store-card .card-title{font-size:15px;line-height:22px;}

  .store-card.is-soon{cursor:default;border-style:dashed;}
  .store-card.is-soon:hover,.store-card.is-soon:active{background:transparent;}
  .store-card.is-soon .icon-box,.store-card.is-soon .card-title,.store-card.is-soon .card-desc{opacity:.6;}
  .chip.soon-badge{background:transparent;color:var(--on-surface-variant);border:1px dashed var(--outline);}
  .doc-body{flex:1;min-width:0;}

     ========================================================================== */
  .snackbar{
    position:fixed;left:50%;bottom:1.25rem;z-index:100;

  @media (max-width:840px){

      transition:background-color .15s ease,opacity .18s ease,transform .18s ease;

const CATEGORIES = [

/* ==========================================================================
   2. 状態管理・ユーティリティ関数・SVGアイコン定義
   ========================================================================== */
let activeCat = null;

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function hl(text, terms){
  let t = esc(text);
  terms.forEach(term => {
    if(!term) return;
    const re = new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    t = t.replace(re, m => `<mark>${m}</mark>`);
  });
  return t;
}

const ICONS = {

/* ==========================================================================

function renderEmergencyCard(item, terms){
  const isExternal = item.url && item.url !== '#' && /^https?:\/\//.test(item.url);
  const targetAttr = isExternal ? ' target="_blank" rel="noopener"' : '';
  const iconSvg = ICONS[item.icon] || ICONS.map;
  const badgeHtml = item.badge ? `<span class="chip emergency-badge">${hl(item.badge, terms)}</span>` : '';

  return `
    <a class="emergency-card js-item-link" href="${esc(item.url)}" data-title="${esc(item.title)}"${targetAttr}>
      <div class="featured-main">
        <span class="icon-box">${iconSvg}</span>

            <h3 class="card-title">${hl(item.title, terms)}</h3>
          </div>
          <p class="card-desc">${hl(item.description, terms)}</p>
        </div>
      </div>
      ${isExternal ? OPEN_ICON : ARROW_ICON}

function renderStoreCard(item, terms){

  const targetAttr = isExternal ? ' target="_blank" rel="noopener"' : '';

function render(){
  const qEl = document.getElementById('q');
  document.getElementById('clearBtn').classList.toggle('show', qEl.value.length > 0);
  const terms = qEl.value.trim().split(/\s+/).filter(Boolean);

  const filtered = ITEMS.filter(item => {
    if(activeCat !== null && item.category !== activeCat) return false;
    if(!terms.length) return true;
    const hay = [item.title, item.displayTitle, item.sub, item.badge, item.chip, item.category, item.description]
      .filter(Boolean).join(' ').toLowerCase();
    return terms.every(t => hay.includes(t.toLowerCase()));
  });

  document.getElementById('status').textContent = `${filtered.length} 件 (全 ${ITEMS.length} 件)`;
  const container = document.getElementById('portal');

  if(!filtered.length){
    container.innerHTML = '<div class="empty">該当するツール・資料がありません</div>';
    return;
  }

  const emergency = filtered.filter(i => i.category === '防災・緊急');
  const tools = filtered.filter(i => i.category === '業務・計算ツール');
  const docs = filtered.filter(i => i.category === '制度・資料');
  const stores = filtered.filter(i => i.category === '店舗別');
  let html = '';

  if(emergency.length){
    html += `
      <section class="section" aria-labelledby="sec-emergency">
        <div class="section-head">
          <h2 class="section-title" id="sec-emergency">防災・緊急</h2>
          <span class="section-count">${emergency.length} 件</span>
        </div>
        <div class="docs-list">
          ${emergency.map(item => renderEmergencyCard(item, terms)).join('')}
        </div>
      </section>`;
  }

  if(tools.length){
    html += `
      <section class="section" aria-labelledby="sec-tools">
        <div class="section-head">
          <h2 class="section-title" id="sec-tools">業務・計算ツール</h2>
          <span class="section-count">${tools.length} 件</span>
        </div>
        <div class="tools-grid">
          ${tools.map(item => renderToolCard(item, terms)).join('')}
        </div>
      </section>`;
  }

  if(docs.length){
    html += `
      <section class="section" aria-labelledby="sec-docs">
        <div class="section-head">
          <h2 class="section-title" id="sec-docs">制度・資料</h2>
          <span class="section-count">${docs.length} 件</span>
        </div>
        <div class="docs-list">
          ${docs.map(item => renderDocCard(item, terms)).join('')}
        </div>
      </section>`;
  }

  if(stores.length){
    html += `
      <section class="section" aria-labelledby="sec-stores">
        <div class="section-head">
          <h2 class="section-title" id="sec-stores">店舗別</h2>
          <span class="section-count">${stores.length} 件</span>
        </div>
        <div class="docs-list">
          ${stores.map(item => renderStoreCard(item, terms)).join('')}
        </div>
      </section>`;
  }

  container.innerHTML = html;
}

/* ==========================================================================
   4. カテゴリナビゲーション構築
   ========================================================================== */
function addNavItem(list, label, count, value, swatchColor){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'nav-item';
  btn.setAttribute('aria-pressed', value === null ? 'true' : 'false');
  btn.innerHTML = `
    <span class="lead">
      ${swatchColor ? `<span class="swatch" style="background:${swatchColor}"></span>` : ''}
      <span>${esc(label)}</span>
    </span>
    <span class="n">${count}</span>`;
  btn.addEventListener('click', () => {
    activeCat = value;
    [...list.children].forEach(el => el.setAttribute('aria-pressed', el === btn ? 'true' : 'false'));
    render();
  });
  list.appendChild(btn);
}

function buildNav(){
  const catList = document.getElementById('catList');
  addNavItem(catList, 'すべて', ITEMS.length, null, null);
  CATEGORIES.forEach(cat => {
    const count = ITEMS.filter(i => i.category === cat.name).length;
    addNavItem(catList, cat.name, count, cat.name, cat.swatchColor);
  });
}

/* ==========================================================================
   5. Snackbar（リンク未設定時の案内）
   ========================================================================== */
let snackbarTimer = null;
const snackbarEl = document.getElementById('snackbar');
const snackbarMsgEl = document.getElementById('snackbarMsg');

function showSnackbar(message){
  snackbarMsgEl.textContent = message;
  snackbarEl.classList.add('show');
  if(snackbarTimer) clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(() => snackbarEl.classList.remove('show'), 2800);
}

document.getElementById('snackbarClose').addEventListener('click', () => {
  snackbarEl.classList.remove('show');
  if(snackbarTimer) clearTimeout(snackbarTimer);
});

document.getElementById('portal').addEventListener('click', e => {
  const link = e.target.closest('.js-item-link');
  if(!link) return;
  if(link.getAttribute('href') === '#'){
    e.preventDefault();
    const title = link.dataset.title || '';
    showSnackbar(`「${title}」のリンク先（URLを設定してください）`);
  }
});

/* ==========================================================================
   6. 検索 & 外観テーマ切替（draft_j_material3.html と共通キー gikai_theme）
   ========================================================================== */
document.getElementById('q').addEventListener('input', render);
document.getElementById('clearBtn').addEventListener('click', () => {
  const q = document.getElementById('q');
  q.value = '';
  render();
  q.focus();
});

const themeBtn = document.getElementById('themeToggle');
const themeLabel = document.getElementById('themeLabel');
const LABEL = { auto:'外観: 自動', light:'外観: ライト', dark:'外観: ダーク' };

function getMode(){
  try { return localStorage.getItem('gikai_theme') || 'auto'; }
  catch(e){ return 'auto'; }
}
function setMode(m){
  try { m === 'auto' ? localStorage.removeItem('gikai_theme') : localStorage.setItem('gikai_theme', m); }
  catch(e){}
}
function applyTheme(){
  const m = getMode();
  if(m === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', m);
  themeLabel.textContent = LABEL[m];
}

themeBtn.addEventListener('click', () => {
  setMode({ auto:'light', light:'dark', dark:'auto' }[getMode()]);
  applyTheme();
});

// 初期化
applyTheme();
buildNav();
render();
</script>
